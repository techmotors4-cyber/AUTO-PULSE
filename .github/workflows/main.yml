name: AUTO PULSE Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Configure compatible versions and build APK
        run: |
          echo "Searching for project directory..."
          
          if [ -d "app" ]; then
            PROJECT_DIR="."
          elif [ -d "AUTO-PULSE-main/app" ]; then
            PROJECT_DIR="AUTO-PULSE-main"
          else
            PROJECT_DIR=$(find . -maxdepth 2 -name "app" -type d | head -n 1 | xargs dirname)
          fi
          
          echo "Target project directory found at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # 1. Create root settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AUTO-PULSE"
          include ':app'
          EOF
          
          # 2. Create root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          # 3. Ensure app/build.gradle exists
          if [ -d "app" ] && [ ! -f "app/build.gradle" ]; then
            mkdir -p app
            cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.autopulse'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.autopulse"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"

                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF
          fi

          # 4. Generate Gradle wrapper if missing
          if [ ! -f gradlew ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.5
          fi
          
          chmod +x gradlew
          # Added --stacktrace so we can see the exact error message in the logs
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload AUTO PULSE APK
        uses: actions/upload-artifact@v4
        with:
          name: AUTO-PULSE-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
