name: AUTO PULSE Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Find project directory and build APK
        run: |
          echo "Searching for project directory..."
          ls -la
          
          # Automatically find the directory containing the 'app' folder
          if [ -d "app" ]; then
            PROJECT_DIR="."
          elif [ -d "AUTO-PULSE-main/app" ]; then
            PROJECT_DIR="AUTO-PULSE-main"
          else
            PROJECT_DIR=$(find . -maxdepth 2 -name "app" -type d | head -n 1 | xargs dirname)
          fi
          
          echo "Target project directory found at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # Ensure settings.gradle exists
          if [ ! -f settings.gradle ]; then
            echo "include ':app'" > settings.gradle
          fi
          
          # Ensure root build.gradle exists
          if [ ! -f build.gradle ]; then
            cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.0' apply false
          }
          EOF
          fi

          # Generate Gradle wrapper if missing
          if [ ! -f gradlew ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.5
          fi
          
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload AUTO PULSE APK
        uses: actions/upload-artifact@v4
        with:
          name: AUTO-PULSE-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
