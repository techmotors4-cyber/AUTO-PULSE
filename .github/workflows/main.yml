name: AUTO PULSE Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & Build Web Application
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK with Platform 34
        uses: android-actions/setup-android@v4
        with:
          items: platforms;android-34,build-tools;34.0.0
          license-accepted: true

      - name: Scaffold Dual-Mode Project and Compile APK
        run: |
          # 1. Create clean Android directory structure
          mkdir -p workspace/app/src/main/java/com/example/autopulse
          mkdir -p workspace/app/src/main/res/values
          mkdir -p workspace/app/src/main/assets

          # 2. Bundle built web application into Android native assets
          cp -r dist/* workspace/app/src/main/assets/

          cd workspace

          # 3. Root settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AUTO-PULSE"
          include ':app'
          EOF

          # 4. Root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          # 5. App-level build.gradle with AndroidX WebKit
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.autopulse'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.autopulse"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.webkit:webkit:1.10.0'
          }
          EOF

          # 6. AndroidManifest.xml with hardware acceleration & network permissions
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:label="Pollachi AutoPulse"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 7. strings.xml
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Pollachi AutoPulse</string>
          </resources>
          EOF

          # 8. MainActivity.kt (Dual-Mode Container: Virtual HTTPS Origin + Live Fallback)
          cat << 'EOF' > app/src/main/java/com/example/autopulse/MainActivity.kt
          package com.example.autopulse

          import android.os.Bundle
          import android.content.Intent
          import android.net.Uri
          import android.webkit.WebResourceRequest
          import android.webkit.WebResourceResponse
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.webkit.WebViewAssetLoader
          import androidx.webkit.WebViewClientCompat

          class MainActivity : AppCompatActivity() {
              private lateinit var webView: WebView
              private val liveFallbackUrl = "https://ais-dev-zkfi7yuuodf4mdgkonsf3m-325442176855.asia-east1.run.app"
              private var hasFallenBack = false

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  // Setup official WebViewAssetLoader for secure virtual HTTPS origin
                  val assetLoader = WebViewAssetLoader.Builder()
                      .addPathHandler("/assets/", WebViewAssetLoader.AssetsPathHandler(this))
                      .build()

                  webView = WebView(this)
                  setContentView(webView)

                  // Enable high-performance modern webview capabilities
                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      databaseEnabled = true
                      allowFileAccess = true
                      allowContentAccess = true
                      useWideViewPort = true
                      loadWithOverviewMode = true
                      cacheMode = WebSettings.LOAD_DEFAULT
                      mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
                  }

                  // Handle asset interception, external phone/WhatsApp intents, and live fallback
                  webView.webViewClient = object : WebViewClientCompat() {
                      override fun shouldInterceptRequest(
                          view: WebView,
                          request: WebResourceRequest
                      ): WebResourceResponse? {
                          return assetLoader.shouldInterceptRequest(request.url)
                      }

                      override fun shouldOverrideUrlLoading(
                          view: WebView,
                          request: WebResourceRequest
                      ): Boolean {
                          val url = request.url.toString()
                          if (url.startsWith("tel:") || url.startsWith("whatsapp:") || url.startsWith("https://wa.me/") || url.startsWith("http://wa.me/")) {
                              try {
                                  val intent = Intent(Intent.ACTION_VIEW, Uri.parse(url))
                                  startActivity(intent)
                                  return true
                              } catch (e: Exception) {
                                  return false
                              }
                          }
                          return false
                      }

                      override fun onReceivedError(
                          view: WebView,
                          request: WebResourceRequest,
                          error: androidx.webkit.WebResourceErrorCompat
                      ) {
                          super.onReceivedError(view, request, error)
                          if (request.isForMainFrame && !hasFallenBack) {
                              hasFallenBack = true
                              Toast.makeText(this@MainActivity, "Connecting to Pollachi AutoPulse...", Toast.LENGTH_SHORT).show()
                              view.loadUrl(liveFallbackUrl)
                          }
                      }
                  }

                  // Primary Mode: Load high-speed offline assets via secure virtual origin
                  webView.loadUrl("https://appassets.androidplatform.net/assets/index.html")
              }

              override fun onBackPressed() {
                  if (this::webView.isInitialized && webView.canGoBack()) {
                      webView.goBack()
                  } else {
                      super.onBackPressed()
                  }
              }
          }
          EOF

          # 9. Local properties mapping the SDK path
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          # 10. Gradle properties with optimized memory allocation
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          # 11. Download and run Gradle 8.5
          echo "Downloading Gradle 8.5 binary..."
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip

          export JAVA_HOME=$JAVA_HOME
          echo "Compiling Release-Ready Debug APK with Gradle 8.5..."
          ./gradle-8.5/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: Upload AUTO PULSE APK
        uses: actions/upload-artifact@v4
        with:
          name: AUTO-PULSE-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
