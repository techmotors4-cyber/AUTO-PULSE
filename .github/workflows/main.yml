name: AUTO PULSE Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & Build Web App
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK with Platform 34
        uses: android-actions/setup-android@v4
        with:
          items: platforms;android-34,build-tools;34.0.0
          license-accepted: true

      - name: Scaffold Complete Project and Build APK
        run: |
          # Create a clean working workspace directory
          mkdir -p workspace/app/src/main/java/com/example/autopulse
          mkdir -p workspace/app/src/main/res/values
          mkdir -p workspace/app/src/main/assets

          # Copy built web application into Android assets
          cp -r dist/* workspace/app/src/main/assets/

          cd workspace

          # 1. Root settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AUTO-PULSE"
          include ':app'
          EOF

          # 2. Root build.gradle (Using stable AGP 8.2.2)
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          # 3. App-level build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.autopulse'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.autopulse"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.webkit:webkit:1.10.0'
          }
          EOF

          # 4. AndroidManifest.xml (With internet & phone call permissions)
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:label="Pollachi AutoPulse"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 5. strings.xml
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Pollachi AutoPulse</string>
          </resources>
          EOF

          # 6. MainActivity.kt (Full-Screen WebApp Container Loading Bundled Assets)
          cat << 'EOF' > app/src/main/java/com/example/autopulse/MainActivity.kt
          package com.example.autopulse

          import android.os.Bundle
          import android.webkit.WebChromeClient
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.content.Intent
          import android.net.Uri
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              private lateinit var webView: WebView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  webView = WebView(this)
                  setContentView(webView)

                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      databaseEnabled = true
                      allowFileAccess = true
                      allowContentAccess = true
                      useWideViewPort = true
                      loadWithOverviewMode = true
                      cacheMode = WebSettings.LOAD_DEFAULT
                      mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
                  }

                  webView.webChromeClient = WebChromeClient()
                  webView.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(view: WebView, url: String): Boolean {
                          if (url.startsWith("tel:") || url.startsWith("whatsapp:") || url.startsWith("https://wa.me/") || url.startsWith("http://wa.me/")) {
                              try {
                                  val intent = Intent(Intent.ACTION_VIEW, Uri.parse(url))
                                  startActivity(intent)
                                  return true
                              } catch (e: Exception) {
                                  return false
                              }
                          }
                          return false
                      }
                  }

                  // Load bundled Pollachi AutoPulse web application
                  webView.loadUrl("file:///android_asset/index.html")
              }

              override fun onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack()
                  } else {
                      super.onBackPressed()
                  }
              }
          }
          EOF

          # 7. Local properties mapping the SDK path
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          # 8. Gradle properties enforcing stable AAPT2 behavior
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          # 9. Download and use Gradle 8.5 binary directly
          echo "Downloading Gradle 8.5 binary..."
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip

          export JAVA_HOME=$JAVA_HOME
          echo "Executing Gradle build..."
          ./gradle-8.5/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: Upload AUTO PULSE APK
        uses: actions/upload-artifact@v4
        with:
          name: AUTO-PULSE-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
