name: AUTO PULSE Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & Build Web Application
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK with Platform 34 & Build Tools
        uses: android-actions/setup-android@v4
        with:
          items: platforms;android-34,build-tools;34.0.0
          license-accepted: true

      - name: Scaffold Complete Project, Sign with V1/V2/V3 and Build APK
        run: |
          # 1. Create clean Android directory structure with proper package id
          mkdir -p workspace/app/src/main/java/com/pollachi/autopulse
          mkdir -p workspace/app/src/main/res/values
          mkdir -p workspace/app/src/main/assets

          # 2. Bundle built web application into Android native assets
          cp -r dist/* workspace/app/src/main/assets/

          # 3. Generate a dedicated 2048-bit RSA signing keystore for Pollachi AutoPulse
          keytool -genkeypair -v \
            -keystore pollachi.keystore \
            -alias pollachi \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass pollachi123 \
            -keypass pollachi123 \
            -dname "CN=Pollachi AutoPulse, OU=Dispatch, O=AutoPulse, L=Pollachi, ST=TamilNadu, C=IN"

          cd workspace

          # 4. Root settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PollachiAutoPulse"
          include ':app'
          EOF

          # 5. Root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          # 6. App-level build.gradle with dedicated signing configuration
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.pollachi.autopulse'
              compileSdk 34

              defaultConfig {
                  applicationId "com.pollachi.autopulse"
                  minSdk 24
                  targetSdk 34
                  versionCode 2
                  versionName "1.0.1"
                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
              }

              signingConfigs {
                  release {
                      storeFile file("../../pollachi.keystore")
                      storePassword "pollachi123"
                      keyAlias "pollachi"
                      keyPassword "pollachi123"
                      v1SigningEnabled true
                      v2SigningEnabled true
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
                  debug {
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.webkit:webkit:1.10.0'
          }
          EOF

          # 7. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:label="Pollachi AutoPulse"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 8. strings.xml
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Pollachi AutoPulse</string>
          </resources>
          EOF

          # 9. MainActivity.kt (Dual Mode with WebViewAssetLoader and live fallback)
          cat << 'EOF' > app/src/main/java/com/pollachi/autopulse/MainActivity.kt
          package com.pollachi.autopulse

          import android.os.Bundle
          import android.content.Intent
          import android.net.Uri
          import android.webkit.WebResourceRequest
          import android.webkit.WebResourceResponse
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.webkit.WebViewAssetLoader
          import androidx.webkit.WebViewClientCompat

          class MainActivity : AppCompatActivity() {
              private lateinit var webView: WebView
              private val liveFallbackUrl = "https://ais-dev-zkfi7yuuodf4mdgkonsf3m-325442176855.asia-east1.run.app"
              private var hasFallenBack = false

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val assetLoader = WebViewAssetLoader.Builder()
                      .addPathHandler("/assets/", WebViewAssetLoader.AssetsPathHandler(this))
                      .build()

                  webView = WebView(this)
                  setContentView(webView)

                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      databaseEnabled = true
                      allowFileAccess = true
                      allowContentAccess = true
                      useWideViewPort = true
                      loadWithOverviewMode = true
                      cacheMode = WebSettings.LOAD_DEFAULT
                      mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
                  }

                  webView.webViewClient = object : WebViewClientCompat() {
                      override fun shouldInterceptRequest(
                          view: WebView,
                          request: WebResourceRequest
                      ): WebResourceResponse? {
                          return assetLoader.shouldInterceptRequest(request.url)
                      }

                      override fun shouldOverrideUrlLoading(
                          view: WebView,
                          request: WebResourceRequest
                      ): Boolean {
                          val url = request.url.toString()
                          if (url.startsWith("tel:") || url.startsWith("whatsapp:") || url.startsWith("https://wa.me/") || url.startsWith("http://wa.me/")) {
                              try {
                                  val intent = Intent(Intent.ACTION_VIEW, Uri.parse(url))
                                  startActivity(intent)
                                  return true
                              } catch (e: Exception) {
                                  return false
                              }
                          }
                          return false
                      }

                      override fun onReceivedError(
                          view: WebView,
                          request: WebResourceRequest,
                          error: androidx.webkit.WebResourceErrorCompat
                      ) {
                          super.onReceivedError(view, request, error)
                          if (request.isForMainFrame && !hasFallenBack) {
                              hasFallenBack = true
                              Toast.makeText(this@MainActivity, "Connecting to Pollachi AutoPulse...", Toast.LENGTH_SHORT).show()
                              view.loadUrl(liveFallbackUrl)
                          }
                      }
                  }

                  webView.loadUrl("https://appassets.androidplatform.net/assets/index.html")
              }

              override fun onBackPressed() {
                  if (this::webView.isInitialized && webView.canGoBack()) {
                      webView.goBack()
                  } else {
                      super.onBackPressed()
                  }
              }
          }
          EOF

          # 10. Local properties mapping the SDK path
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          # 11. Gradle properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          # 12. Download and run Gradle 8.5
          echo "Downloading Gradle 8.5..."
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip

          export JAVA_HOME=$JAVA_HOME
          echo "Building signed APK..."
          ./gradle-8.5/bin/gradle assembleRelease --no-daemon --stacktrace

          # 13. Align and re-sign with apksigner (v1, v2, v3 schemes) to ensure 100% install success on all phones
          echo "Locating built APK..."
          RAW_APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$RAW_APK" ]; then
              RAW_APK=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          fi
          echo "Found raw APK: $RAW_APK"

          $ANDROID_HOME/build-tools/34.0.0/zipalign -v -p 4 "$RAW_APK" Pollachi-AutoPulse-aligned.apk

          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks ../pollachi.keystore \
            --ks-pass pass:pollachi123 \
            --ks-key-alias pollachi \
            --key-pass pass:pollachi123 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out ../Pollachi-AutoPulse.apk \
            Pollachi-AutoPulse-aligned.apk

          echo "Verifying APK Signature Schemes..."
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose ../Pollachi-AutoPulse.apk

      - name: Upload Pollachi AutoPulse APK
        uses: actions/upload-artifact@v4
        with:
          name: Pollachi-AutoPulse-APK
          path: Pollachi-AutoPulse.apk
          if-no-files-found: error
          retention-days: 14
